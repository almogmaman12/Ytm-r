<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<title>YTM Remote</title>
<style>
  :root { --bg:#111; --fg:#f2f2f2; --muted:#9a9a9a; --card:#1c1c1e; --accent:#ff3d5a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px system-ui,sans-serif;
         min-height:100vh; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .wrap { max-width:420px; margin:0 auto; }
  #dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#666; margin-right:8px; }
  #dot.on { background:#2ecc71; }
  header { color:var(--muted); font-size:14px; margin-bottom:16px; }
  #art { width:100%; aspect-ratio:1; border-radius:16px; background:var(--card) center/cover; }
  #title { font-size:22px; font-weight:700; margin:16px 0 2px; }
  #artist { color:var(--muted); margin-bottom:16px; }
  #bar { height:4px; background:#333; border-radius:2px; overflow:hidden; margin-bottom:20px; }
  #fill { height:100%; width:0; background:var(--accent); }
  .row { display:flex; justify-content:center; align-items:center; gap:20px; margin-bottom:24px; }
  button { background:var(--card); color:var(--fg); border:0; border-radius:50%; width:64px; height:64px;
           font-size:24px; cursor:pointer; }
  button:active { transform:scale(.94); }
  #toggle { width:84px; height:84px; background:var(--accent); font-size:32px; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .vol { display:flex; align-items:center; gap:12px; }
  #searchForm { display:flex; gap:8px; margin:28px 0 12px; }
  #q { flex:1; min-width:0; padding:12px; border-radius:10px; border:1px solid #333;
       background:var(--card); color:var(--fg); font:inherit; }
  #go { width:auto; height:auto; border-radius:10px; padding:0 16px; font-size:16px; background:var(--accent); }
  #searchMsg { color:var(--muted); font-size:14px; min-height:20px; margin-bottom:8px; }
  #results { list-style:none; margin:0; padding:0; }
  #results li { display:flex; align-items:center; gap:12px; padding:8px; border-radius:10px; cursor:pointer; }
  #results li:active { background:var(--card); }
  #results img, #results .ph, #queue img, #queue .ph { width:48px; height:48px; border-radius:6px; background:var(--card); flex:none; object-fit:cover; }
  #results .txt, #queue .txt { min-width:0; flex:1; }
  #results .t, #queue .t { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #results .s, #queue .s { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #results button, #queue button { width:40px; height:40px; font-size:17px; flex:none; background:#2a2a2d; }
  #queueBox { display:none; margin-top:24px; }
  #queueBox h3 { margin:0 0 6px; font-size:14px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  #queue { list-style:none; margin:0; padding:0; }
  #queue li { display:flex; align-items:center; gap:12px; padding:6px 8px; }
  #setup { display:none; }
  #setup input[type=text] { width:100%; padding:12px; border-radius:10px; border:1px solid #333;
                            background:var(--card); color:var(--fg); font:inherit; margin:8px 0 12px; }
  #setup button { width:100%; border-radius:10px; height:48px; font-size:16px; background:var(--accent); }
  #forget { background:none; width:auto; height:auto; color:var(--muted); font-size:13px;
            text-decoration:underline; margin-top:24px; border-radius:0; }
</style>
</head>
<body>
<div class="wrap">
  <div id="setup">
    <h2>Connect</h2>
    <p>Enter the secret token you set in the extension.</p>
    <input type="text" id="tokenInput" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="saveToken">Connect</button>
  </div>

  <div id="player" style="display:none">
    <header><span id="dot"></span><span id="status">Connecting…</span></header>
    <div id="art"></div>
    <div id="title">Nothing playing</div>
    <div id="artist">&nbsp;</div>
    <div id="bar"><div id="fill"></div></div>
    <div class="row">
      <button id="prev" aria-label="Previous">⏮</button>
      <button id="toggle" aria-label="Play or pause">▶</button>
      <button id="next" aria-label="Next">⏭</button>
    </div>
    <div class="vol">🔈 <input type="range" id="vol" min="0" max="100" value="50"> 🔊</div>

    <div id="queueBox">
      <h3>Up next</h3>
      <ul id="queue"></ul>
    </div>

    <form id="searchForm">
      <input id="q" type="search" placeholder="Search songs" enterkeyhint="search"
             autocomplete="off" autocapitalize="off" maxlength="100">
      <button id="go" type="submit">Search</button>
    </form>
    <div id="searchMsg"></div>
    <ul id="results"></ul>

    <div style="text-align:center"><button id="forget">Change token</button></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let ws = null, token = null, retry = 1000, volTimer = null, volDragging = false;

function getToken() {
  try { return localStorage.getItem('token'); } catch { return null; }
}
function setToken(t) {
  try { t ? localStorage.setItem('token', t) : localStorage.removeItem('token'); } catch {}
}

function show() {
  token = getToken();
  $('setup').style.display = token ? 'none' : 'block';
  $('player').style.display = token ? 'block' : 'none';
  if (token) connect();
}

function connect() {
  if (ws && ws.readyState <= 1) return;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?role=phone&token=${encodeURIComponent(token)}`);
  ws.onopen = () => { retry = 1000; $('status').textContent = 'Waiting for PC…'; };
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === 'pc_status') {
      $('dot').classList.toggle('on', m.online);
      $('status').textContent = m.online ? 'PC connected' : 'PC offline';
    } else if (m.type === 'state') render(m.state);
    else if (m.type === 'results') renderResults(m);
    else if (m.type === 'status') $('searchMsg').textContent = m.message;
    else if (m.type === 'queue') renderQueue(m.items);
  };
  ws.onclose = () => {
    $('dot').classList.remove('on');
    $('status').textContent = 'Reconnecting…';
    setTimeout(connect, retry);
    retry = Math.min(retry * 2, 15000);
  };
}

function render(s) {
  $('title').textContent = s.title || 'Nothing playing';
  $('artist').textContent = s.artist || ' ';
  $('toggle').textContent = s.playing ? '⏸' : '▶';
  $('art').style.backgroundImage = s.art ? `url("${s.art}")` : '';
  if (s.duration) $('fill').style.width = Math.min(100, (s.position / s.duration) * 100) + '%';
  if (s.volume != null && !volDragging) $('vol').value = s.volume;
}

let searchTimer = null;

function trackRow(r, button) {
  const li = document.createElement('li');
  let img;
  if (r.thumb) { img = document.createElement('img'); img.src = r.thumb; img.alt = ''; img.loading = 'lazy'; }
  else { img = document.createElement('div'); img.className = 'ph'; }
  const txt = document.createElement('div'); txt.className = 'txt';
  const t = document.createElement('div'); t.className = 't'; t.textContent = r.title;
  const s = document.createElement('div'); s.className = 's'; s.textContent = r.subtitle;
  txt.append(t, s);
  li.append(img, txt);
  if (button) li.append(button);
  return li;
}

function renderQueue(items) {
  const list = $('queue');
  list.textContent = '';
  $('queueBox').style.display = items.length ? 'block' : 'none';
  for (const r of items) {
    const x = document.createElement('button');
    x.textContent = '✕';
    x.setAttribute('aria-label', 'Remove from Up next');
    x.onclick = () => cmd('queue_remove', r.videoId);
    list.append(trackRow(r, x));
  }
}

function renderResults(m) {
  clearTimeout(searchTimer);
  const list = $('results');
  list.textContent = '';
  if (m.error) { $('searchMsg').textContent = 'Search failed: ' + m.error; return; }
  if (!m.results.length) { $('searchMsg').textContent = 'No results'; return; }
  $('searchMsg').textContent = '';
  for (const r of m.results) {
    const nx = document.createElement('button');
    nx.textContent = '⏭';
    nx.title = 'Play next';
    nx.setAttribute('aria-label', 'Play next');
    nx.onclick = (e) => { e.stopPropagation(); cmd('play_next', r.videoId); };
    const li = trackRow(r, nx);
    li.onclick = () => {
      cmd('play_video', r.videoId);
      $('searchMsg').textContent = 'Starting: ' + r.title + '…';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    list.append(li);
  }
}

$('searchForm').onsubmit = (e) => {
  e.preventDefault();
  const q = $('q').value.trim();
  if (!q) return;
  $('q').blur();
  $('results').textContent = '';
  $('searchMsg').textContent = 'Searching…';
  cmd('search', q);
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    $('searchMsg').textContent = 'No response. Is YouTube Music open on the PC?';
  }, 10000);
};

function cmd(c, value) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'cmd', cmd: c, value }));
}

$('toggle').onclick = () => cmd('toggle');
$('next').onclick = () => cmd('next');
$('prev').onclick = () => cmd('previous');
$('vol').oninput = (e) => {
  volDragging = true;
  clearTimeout(volTimer);
  volTimer = setTimeout(() => { cmd('volume', Number(e.target.value)); volDragging = false; }, 80);
};
$('saveToken').onclick = () => {
  const t = $('tokenInput').value.trim();
  if (t.length < 20) return alert('Token must be at least 20 characters.');
  setToken(t); show();
};
$('forget').onclick = () => { setToken(null); try { ws && ws.close(); } catch {} ws = null; show(); };

show();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
