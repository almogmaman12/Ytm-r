<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ytm-r Configuration</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 30px;
      max-width: 440px;
      margin: 0 auto;
      background: #0f0f0f;
      color: #ffffff;
    }
    .card {
      background: #181818;
      border: 1px solid #282828;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h2 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    p {
      color: #aaa;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 13px;
      color: #ddd;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #0f0f0f;
      color: #fff;
      box-sizing: border-box;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #ff0000;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      background: #ff0000;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #cc0000;
    }
    #status {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎵 Ytm-r Setup</h2>
    <p>Enter the base URL of your personal Ytm-r relay server (Render, Railway, or Localhost).</p>
    
    <label for="serverUrl">Relay Server Address</label>
    <input type="url" id="serverUrl" placeholder="https://your-app.onrender.com" required />
    
    <button id="saveBtn">Save & Connect</button>
    <div id="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
