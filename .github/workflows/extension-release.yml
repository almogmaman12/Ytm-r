name: Signed extension release
on:
  push:
    branches: [feature/windows-companion]
    paths: ['companion/release/request.json']
permissions:
  contents: read
concurrency:
  group: signed-extension-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      source: ${{ steps.prepare.outputs.source }}
      tag_target: ${{ steps.prepare.outputs.tag_target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release request and package reviewed source
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('companion/release/request.json','utf8'));
          if(!/^[a-f0-9]{40}$/.test(r.source)||!/^\d+(\.\d+){1,3}$/.test(r.version)||r.version.split('.').some(x=>Number(x)>65535||String(Number(x))!==x)) throw new Error('Invalid release request');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'source='+r.source+'\nversion='+r.version+'\n');
          JS
          SOURCE=$(node -p "JSON.parse(require('fs').readFileSync('companion/release/request.json')).source")
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('companion/release/request.json')).version")
          # Only this explicitly reviewed experimental source is exempt from the OTA ancestry rule.
          if [ "$SOURCE" = "dd54daf7c6a4a8c77409eddad13b9c4bfe12576d" ] && [ "$VERSION" = "2.4.4" ]; then
            git merge-base --is-ancestor "$SOURCE" refs/remotes/origin/feature/windows-companion
            git diff --name-only 00daa123049cb7ea8b3fdd36f420fb6fa7e31eb3 "$SOURCE" -- extension/ | LC_ALL=C sort > actual-extension-files
            printf '%s\n' extension/background.js extension/manifest.json extension/options.html extension/options.js > expected-extension-files
            diff -u expected-extension-files actual-extension-files
            git show "00daa123049cb7ea8b3fdd36f420fb6fa7e31eb3:extension/manifest.json" > baseline-manifest.json
            git show "$SOURCE:extension/manifest.json" > candidate-manifest.json
            node --input-type=module -e 'import fs from "node:fs";import assert from "node:assert/strict";const a=JSON.parse(fs.readFileSync("baseline-manifest.json")),b=JSON.parse(fs.readFileSync("candidate-manifest.json"));a.version=b.version;assert.deepEqual(a,b)'
          else
            git merge-base --is-ancestor "$SOURCE" refs/remotes/origin/feature/ota-remote-loader
          fi
          git show "$SOURCE:extension/manifest.json" | node -e 'const m=JSON.parse(require("fs").readFileSync(0,"utf8"));if(m.manifest_version!==3||m.name!=="Tab Helper"||m.version!==process.argv[1])process.exit(1)' "$VERSION"
          # The Actions token can create a tag at the triggering commit. Use that
          # commit only if its entire extension tree is identical to the reviewed source.
          # Keep the reviewed source SHA separately for release provenance.
          TAG_TARGET="$SOURCE"
          if [ "$(git rev-parse "$SOURCE:extension")" = "$(git rev-parse "$GITHUB_SHA:extension")" ]; then
            TAG_TARGET="$GITHUB_SHA"
          fi
          printf 'tag_target=%s\n' "$TAG_TARGET" >> "$GITHUB_OUTPUT"
          mkdir -p release-input
          git archive --format=zip --output=release-input/extension.zip "$SOURCE:extension"
          test "$(stat -c%s release-input/extension.zip)" -le 8388608
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-extension-source
          path: release-input/extension.zip
          retention-days: 1
          if-no-files-found: error
  sign:
    needs: prepare
    runs-on: ubuntu-latest
    environment: extension-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-extension-source
          path: release-input
      - name: Verify publisher key and sign archive
        env:
          YTM_EXTENSION_PRIVATE_KEY_PEM: ${{ secrets.YTM_EXTENSION_PRIVATE_KEY_PEM }}
          YTM_EXTENSION_PUBLIC_KEY_PEM: ${{ vars.YTM_EXTENSION_PUBLIC_KEY_PEM }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEY=$(mktemp)
          trap 'rm -f "$KEY"' EXIT
          test -n "$YTM_EXTENSION_PRIVATE_KEY_PEM"
          test -n "$YTM_EXTENSION_PUBLIC_KEY_PEM"
          printf '%s\n' "$YTM_EXTENSION_PRIVATE_KEY_PEM" > "$KEY"
          unset YTM_EXTENSION_PRIVATE_KEY_PEM
          KEY_PATH="$KEY" node --input-type=module <<'JS'
          import {createPrivateKey,createPublicKey,timingSafeEqual} from 'node:crypto';
          import {readFileSync} from 'node:fs';
          const privateKey=createPrivateKey(readFileSync(process.env.KEY_PATH));
          const expected=createPublicKey(process.env.YTM_EXTENSION_PUBLIC_KEY_PEM);
          if(privateKey.asymmetricKeyType!=='ec'||privateKey.asymmetricKeyDetails.namedCurve!=='prime256v1')throw Error('Wrong signing key type');
          const a=createPublicKey(privateKey).export({type:'spki',format:'der'});
          const b=expected.export({type:'spki',format:'der'});
          if(a.length!==b.length||!timingSafeEqual(a,b))throw Error('Signing key does not match the companion publisher key');
          JS
          mkdir -p signed-release
          node companion/release/sign-extension.mjs release-input/extension.zip "$RELEASE_VERSION" "$KEY" signed-release
      - uses: actions/upload-artifact@v4
        with:
          name: signed-extension-release
          path: |
            signed-release/extension.zip
            signed-release/extension-release.json
            signed-release/extension-release.sig
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: [prepare, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-extension-release
          path: signed-release
      - name: Verify signed files and create a new release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SOURCE: ${{ needs.prepare.outputs.source }}
          TAG_TARGET: ${{ needs.prepare.outputs.tag_target }}
          YTM_EXTENSION_PUBLIC_KEY_PEM: ${{ vars.YTM_EXTENSION_PUBLIC_KEY_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash,createPublicKey,verify} from 'node:crypto';
          const manifest=fs.readFileSync('signed-release/extension-release.json');
          const signature=fs.readFileSync('signed-release/extension-release.sig');
          const key=createPublicKey(process.env.YTM_EXTENSION_PUBLIC_KEY_PEM);
          if(!verify('sha256',manifest,{key,dsaEncoding:'ieee-p1363'},signature))throw Error('Signature verification failed');
          const m=JSON.parse(manifest);
          if(m.format!==1||m.product!=='YTM Remote extension'||m.version!==process.env.RELEASE_VERSION||m.sha256!==createHash('sha256').update(fs.readFileSync('signed-release/extension.zip')).digest('hex'))throw Error('Release verification failed');
          JS
          TAG="extension-v$RELEASE_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          gh release create "$TAG" signed-release/extension.zip signed-release/extension-release.json signed-release/extension-release.sig --target "$TAG_TARGET" --title "YTM Remote extension $RELEASE_VERSION" --notes "Signed extension release from reviewed commit $RELEASE_SOURCE. Release tag points to $TAG_TARGET (identical extension tree)." --latest
