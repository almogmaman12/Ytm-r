name: Windows companion build
on:
  push:
    branches: [feature/windows-companion]
    paths: ['companion/build-request.json']
  workflow_dispatch:
concurrency:
  group: companion-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows x64
        shell: pwsh
        env:
          YTM_EXTENSION_PUBLIC_KEY_PEM: ${{ vars.YTM_EXTENSION_PUBLIC_KEY_PEM }}
        run: |
          $buildArgs = @()
          if ($env:YTM_EXTENSION_PUBLIC_KEY_PEM) {
            $pem = $env:YTM_EXTENSION_PUBLIC_KEY_PEM.Trim()
            if ($pem -notmatch '(?s)\A-----BEGIN PUBLIC KEY-----\s+[A-Za-z0-9+/=\r\n]+-----END PUBLIC KEY-----\z') { throw 'Expected a public PEM key only' }
            $key = Join-Path $env:RUNNER_TEMP 'ytmr-release-public.pem'
            [IO.File]::WriteAllText($key, $pem)
            node -e "const k=require('node:crypto').createPublicKey(require('node:fs').readFileSync(process.argv[1])); if(k.asymmetricKeyType!=='ec'||k.asymmetricKeyDetails.namedCurve!=='prime256v1')process.exit(1)" "$key"
            if ($LASTEXITCODE -ne 0) { throw 'Invalid P-256 publisher key' }
            $buildArgs += "-p:ExtensionPublicKeyPath=$key"
            $buildArgs += '-p:RequirePublisherKey=true'
          }
          dotnet publish companion/YtmCompanion.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o companion/out @buildArgs
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Test settings persistence across process restarts
        shell: pwsh
        run: |
          $settings = Join-Path $env:RUNNER_TEMP ("ytmr-settings-test-" + [Guid]::NewGuid().ToString("N") + "\settings.json")
          dotnet run --project companion/tests/YtmCompanion.Tests.csproj -c Release -- write "$settings"
          if ($LASTEXITCODE -ne 0) { throw 'Settings write test failed' }
          dotnet run --project companion/tests/YtmCompanion.Tests.csproj -c Release --no-build -- read "$settings"
          if ($LASTEXITCODE -ne 0) { throw 'Settings reload test failed' }
      - name: Test signed extension updater
        shell: pwsh
        run: |
          dotnet run --project companion/tests/YtmCompanion.Tests.csproj -c Release --no-build -- updater
          if ($LASTEXITCODE -ne 0) { throw 'Extension updater test failed' }
      - name: Test native status credentials
        shell: pwsh
        run: |
          dotnet run --project companion/tests/YtmCompanion.Tests.csproj -c Release --no-build -- native
          if ($LASTEXITCODE -ne 0) { throw 'Native status credentials test failed' }
      - name: Smoke-test MSIX packaging with disposable test certificate
        shell: pwsh
        env:
          YTM_EXTENSION_PUBLIC_KEY_PEM: ${{ vars.YTM_EXTENSION_PUBLIC_KEY_PEM }}
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP ('ytmr-msix-test-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $work | Out-Null
          $cert = $null
          try {
            $key = Join-Path $work 'extension-public.pem'
            if ($env:YTM_EXTENSION_PUBLIC_KEY_PEM) {
              [IO.File]::WriteAllText($key, $env:YTM_EXTENSION_PUBLIC_KEY_PEM.Trim())
            } else {
              node -e "const k=require('node:crypto').generateKeyPairSync('ec',{namedCurve:'prime256v1'});require('node:fs').writeFileSync(process.argv[1],k.publicKey.export({type:'spki',format:'pem'}))" "$key"
              if ($LASTEXITCODE -ne 0) { throw 'Test public key creation failed' }
            }
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=YTM Remote Companion CI Test' -CertStoreLocation Cert:\CurrentUser\My -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -NotAfter (Get-Date).AddDays(2)
            $cer = Join-Path $work 'test.cer'
            Export-Certificate -Cert $cert -FilePath $cer | Out-Null
            Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
            & ./companion/release/package-msix.ps1 -Publisher $cert.Subject -CertificateThumbprint $cert.Thumbprint -Version '0.1.0.0' -OutputDirectory $work -ExtensionPublicKeyPath $key
            $msix = Join-Path $work 'YtmCompanion-0.1.0.0.msix'
            if (!(Test-Path $msix)) { throw 'Signed MSIX missing' }
            [xml]$app = Get-Content (Join-Path $work 'YtmCompanion.appinstaller') -Raw
            if ($app.AppInstaller.MainPackage.Name -ne 'YtmRemote.Companion' -or
                $app.AppInstaller.MainPackage.Publisher -ne $cert.Subject -or
                $app.AppInstaller.MainPackage.Version -ne '0.1.0.0' -or
                $app.AppInstaller.MainPackage.Uri -notlike '*/companion-channel/YtmCompanion-0.1.0.0.msix' -or
                $app.AppInstaller.UpdateSettings.OnLaunch.HoursBetweenUpdateChecks -ne '0' -or
                $app.AppInstaller.UpdateSettings.OnLaunch.ShowPrompt -ne 'false' -or
                $null -eq $app.AppInstaller.UpdateSettings.AutomaticBackgroundTask) { throw 'App Installer configuration invalid' }
            Write-Host 'PASS: MSIX packed, signed and verified; App Installer feed validated. Test package is not distributed.'
          } finally {
            if ($cert) {
              Remove-Item -LiteralPath "Cert:\LocalMachine\TrustedPeople\$($cert.Thumbprint)" -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($cert.Thumbprint)" -ErrorAction SilentlyContinue
            }
            Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: YtmCompanion-windows-x64-test-build
          path: companion/out/
          retention-days: 7
