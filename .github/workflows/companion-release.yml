name: Signed Windows companion release
on:
  push:
    branches: [feature/windows-companion]
    paths: ['companion/release/companion-request.json']
permissions:
  contents: read
concurrency:
  group: companion-signed-release
  cancel-in-progress: false
jobs:
  relay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test relay and native status
        working-directory: server
        run: |
          npm install --ignore-scripts
          npm test
  package:
    needs: relay-tests
    runs-on: windows-latest
    environment: companion-signing
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test companion before packaging
        shell: pwsh
        run: |
          $settings = Join-Path $env:RUNNER_TEMP ("ytmr-release-test-" + [Guid]::NewGuid().ToString("N") + "\settings.json")
          dotnet run --project companion/tests/YtmCompanion.Tests.csproj -c Release -- write "$settings"
          if ($LASTEXITCODE -ne 0) { throw 'Settings test failed' }
          dotnet run --project companion/tests/YtmCompanion.Tests.csproj -c Release --no-build -- read "$settings"
          if ($LASTEXITCODE -ne 0) { throw 'Settings reload test failed' }
          dotnet run --project companion/tests/YtmCompanion.Tests.csproj -c Release --no-build -- updater
          if ($LASTEXITCODE -ne 0) { throw 'Updater test failed' }
      - name: Build and sign MSIX with pinned publisher certificate
        id: package
        shell: pwsh
        env:
          YTM_MSIX_PFX_BASE64: ${{ secrets.YTM_MSIX_PFX_BASE64 }}
          YTM_MSIX_PFX_PASSWORD: ${{ secrets.YTM_MSIX_PFX_PASSWORD }}
          YTM_MSIX_CERT_SHA256: ${{ vars.YTM_MSIX_CERT_SHA256 }}
          YTM_EXTENSION_PUBLIC_KEY_PEM: ${{ vars.YTM_EXTENSION_PUBLIC_KEY_PEM }}
        run: |
          $ErrorActionPreference = 'Stop'
          $request = Get-Content companion/release/companion-request.json -Raw | ConvertFrom-Json
          $version = [string]$request.version
          if ($version -notmatch '^(0|[1-9][0-9]{0,4})(\.(0|[1-9][0-9]{0,4})){3}$' -or ($version.Split('.') | Where-Object { [int]$_ -gt 65535 })) { throw 'Invalid release version' }
          if (!$env:YTM_MSIX_PFX_BASE64 -or !$env:YTM_MSIX_PFX_PASSWORD -or !$env:YTM_EXTENSION_PUBLIC_KEY_PEM -or $env:YTM_MSIX_CERT_SHA256 -notmatch '^[A-Fa-f0-9]{64}$') { throw 'Complete the companion-signing environment first' }
          $work = Join-Path $env:RUNNER_TEMP ('ytmr-sign-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $work | Out-Null
          $cert = $null
          $imported = $false
          $pfx = Join-Path $work 'publisher.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:YTM_MSIX_PFX_BASE64))
            $password = ConvertTo-SecureString $env:YTM_MSIX_PFX_PASSWORD -AsPlainText -Force
            Remove-Item Env:\YTM_MSIX_PFX_BASE64, Env:\YTM_MSIX_PFX_PASSWORD
            $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx,$password,[System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
            $hash = $cert.GetCertHashString([System.Security.Cryptography.HashAlgorithmName]::SHA256)
            if ($hash -ne $env:YTM_MSIX_CERT_SHA256 -or $cert.Subject -ne 'CN=YTM Remote Companion' -or !$cert.HasPrivateKey -or $cert.NotAfter -le (Get-Date) -or $cert.NotBefore -gt (Get-Date)) { throw 'Invalid or unexpected publisher certificate' }
            $import = Import-PfxCertificate -FilePath $pfx -Password $password -CertStoreLocation Cert:\CurrentUser\My
            $imported = $true
            if ($import.Thumbprint -ne $cert.Thumbprint) { throw 'Unexpected imported certificate' }
            Remove-Item -LiteralPath $pfx -Force
            $cer = Join-Path $work 'publisher.cer'
            Export-Certificate -Cert $cert -FilePath $cer | Out-Null
            Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
            $key = Join-Path $work 'extension-public.pem'
            [IO.File]::WriteAllText($key,$env:YTM_EXTENSION_PUBLIC_KEY_PEM.Trim())
            & ./companion/release/package-msix.ps1 -Publisher $cert.Subject -CertificateThumbprint $cert.Thumbprint -Version $version -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'companion-release-out') -ExtensionPublicKeyPath $key
            "version=$version" >> $env:GITHUB_OUTPUT
          } finally {
            if ($cert) {
              Remove-Item -LiteralPath "Cert:\LocalMachine\TrustedPeople\$($cert.Thumbprint)" -ErrorAction SilentlyContinue
              if ($imported) { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($cert.Thumbprint)" -ErrorAction SilentlyContinue }
              $cert.Dispose()
            }
            Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: signed-companion-package
          path: |
            companion-release-out/YtmCompanion-*.msix
            companion-release-out/YtmCompanion.appinstaller
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-companion-package
          path: signed
      - name: Publish versioned package then update descriptor
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=companion-channel
          PACKAGE="YtmCompanion-$VERSION.msix"
          test -f "signed/$PACKAGE"
          test -f signed/YtmCompanion.appinstaller
          python - <<'PY'
          import os,xml.etree.ElementTree as E
          root=E.parse('signed/YtmCompanion.appinstaller').getroot()
          ns={'a':'http://schemas.microsoft.com/appx/appinstaller/2018'}
          v=os.environ['VERSION']
          base='https://github.com/almogmaman12/Ytm-r/releases/download/companion-channel/'
          p=root.find('a:MainPackage',ns)
          assert root.attrib['Version']==v and root.attrib['Uri']==base+'YtmCompanion.appinstaller'
          assert p is not None and p.attrib['Version']==v and p.attrib['Publisher']=='CN=YTM Remote Companion' and p.attrib['Name']=='YtmRemote.Companion' and p.attrib['Uri']==base+'YtmCompanion-'+v+'.msix'
          launch=root.find('a:UpdateSettings/a:OnLaunch',ns)
          assert launch is not None and launch.attrib['HoursBetweenUpdateChecks']=='0' and launch.attrib['ShowPrompt']=='false' and launch.attrib['UpdateBlocksActivation']=='false'
          assert root.find('a:UpdateSettings/a:AutomaticBackgroundTask',ns) is not None
          PY
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p previous
            gh release download "$TAG" --pattern YtmCompanion.appinstaller --dir previous
            python - <<'PY'
          import os,xml.etree.ElementTree as E
          root=E.parse('previous/YtmCompanion.appinstaller').getroot()
          assert tuple(map(int,os.environ['VERSION'].split('.')))>tuple(map(int,root.attrib['Version'].split('.'))),'Release must increase version'
          PY
            gh release upload "$TAG" "signed/$PACKAGE"
            gh release upload "$TAG" signed/YtmCompanion.appinstaller --clobber
          else
            gh release create "$TAG" "signed/$PACKAGE" signed/YtmCompanion.appinstaller --target "$GITHUB_SHA" --title 'YTM Remote Companion update channel' --notes 'Signed Windows packages. Extension releases are separate.' --latest=false
          fi
